<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — LINK Family Admin</title>
    <meta
      name="description"
      content="Sign in to the LINK Family Admin dashboard — email/password or Google when Firebase is configured; local demo auth otherwise."
    />
    <meta name="theme-color" content="#1FA88A" />
    <meta property="og:site_name" content="LINK" />
    <meta property="og:title" content="Log in — LINK Family Admin" />
    <meta property="og:description" content="Sign in to manage your family’s pooled points." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/brand/og-image.jpg" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div data-chrome-header></div>

    <main id="main">
      <section class="page-hero auth-page" aria-labelledby="login-title">
        <div class="page-hero__atmos" aria-hidden="true"></div>
        <div class="shell">
          <div class="auth-card reveal" style="--i: 0" data-login>
            <p class="auth-card__eyebrow">Family Admin</p>
            <h1 id="login-title">Log in to LINK</h1>
            <p class="auth-card__lead">
              See your family’s pooled points, simulate monthly earning, and check how much ordinary spend gets you to the getaway goal.
            </p>

            <p class="auth-mode" data-auth-mode>Checking auth…</p>

            <div class="auth-tabs" role="tablist" aria-label="Account">
              <button type="button" role="tab" id="tab-login" aria-controls="panel-login" aria-selected="true" tabindex="0">
                Log in
              </button>
              <button type="button" role="tab" id="tab-register" aria-controls="panel-register" aria-selected="false" tabindex="-1">
                Register
              </button>
            </div>

            <div id="panel-login" role="tabpanel" data-auth-panel aria-labelledby="tab-login">
              <form class="auth-form" data-login-form novalidate>
                <label for="login-email">Email</label>
                <input id="login-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters" />
                <button class="btn btn--primary" type="submit">Log in</button>
              </form>
            </div>

            <div id="panel-register" role="tabpanel" data-auth-panel hidden aria-labelledby="tab-register">
              <form class="auth-form" data-register-form novalidate>
                <label for="register-name">Display name</label>
                <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Nan Somsri" />
                <label for="register-email">Email</label>
                <input id="register-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
                <label for="register-password">Password</label>
                <input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters" />
                <button class="btn btn--primary" type="submit">Create account</button>
              </form>
            </div>

            <div class="auth-divider" aria-hidden="true"><span>or</span></div>

            <button class="btn btn--secondary" type="button" data-google-login style="width: 100%">
              Continue with Google
            </button>
            <p class="auth-google-hint" data-google-hint hidden></p>

            <p class="auth-status" data-auth-status hidden></p>

            <a class="auth-home" href="/">← Back to LINK home</a>
          </div>
        </div>
      </section>
    </main>

    <div data-chrome-footer></div>
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
