<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDP Admin login — LINK</title>
    <meta
      name="description"
      content="Sign in to the LINK Admin CDP dashboard. Course demo credentials for professor access."
    />
    <meta name="theme-color" content="#2360e8" />
    <meta name="robots" content="noindex" />
    <meta property="og:site_name" content="LINK" />
    <meta property="og:title" content="CDP Admin login — LINK" />
    <meta property="og:description" content="Professor demo gate for the LINK Admin CDP dashboard." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/brand/og-image.jpg" />
    <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/brand/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div data-chrome-header></div>

    <main id="main">
      <section class="page-hero auth-page" aria-labelledby="cdp-login-title">
        <div class="page-hero__atmos" aria-hidden="true"></div>
        <div class="shell">
          <div class="auth-card reveal" style="--i: 0" data-cdp-login>
            <p class="auth-card__eyebrow">LINK Admin · CDP</p>
            <h1 id="cdp-login-title">CDP Admin login</h1>
            <p class="auth-card__lead">
              Simulated pilot dashboard for course review. Separate from Family Admin
              (<a href="/login.html">consumer login</a>.
            </p>

            <p class="auth-mode" data-mode="demo">Course / demo credentials · professor access</p>
            <p class="auth-demo-note">
              Demo: <code>kent</code> / <code>2026</code>. Same pair works on
              <a href="/login.html">Family Admin</a>
              (separate session key).
            </p>

            <form class="auth-form" data-cdp-login-form novalidate>
              <label for="cdp-username">Username</label>
              <input
                id="cdp-username"
                name="username"
                type="text"
                autocomplete="username"
                required
                placeholder="Username"
              />
              <label for="cdp-password">Password</label>
              <input
                id="cdp-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Password"
              />
              <button class="btn btn--primary" type="submit">Sign in to CDP Admin</button>
            </form>

            <p class="auth-status" data-cdp-login-status hidden></p>

            <a class="auth-home" href="/for-evaluators.html">← Back to course hub</a>
          </div>
        </div>
      </section>
    </main>

    <div data-chrome-footer></div>
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
